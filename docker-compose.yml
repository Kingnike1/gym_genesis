version: '3.8'

services:
  php:
    build: .
    env_file:
      - .env
    container_name: php
    image: gym_genesis_php
    volumes:
      - ./:/var/www/html/
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      APP_FORCE_HTTPS: ${APP_FORCE_HTTPS:-false}
      APP_SECRET: ${APP_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    ports:
      - "83:80"
    depends_on:
      - db

  db:
    image: mariadb:10.5
    container_name: db
    restart: always
    volumes:
      - ./db/banco.sql:/docker-entrypoint-initdb.d/01-banco.sql:ro
      - ./db/inserts.sql:/docker-entrypoint-initdb.d/02-inserts.sql:ro
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"

  composer:
    image: composer:2.8.9
    container_name: composer
    volumes:
      - .:/gym_genesis
      - composer_cache:/root/.composer/cache
    working_dir: /gym_genesis
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
    stdin_open: true
    tty: true
    command: sh -c "git config --global --add safe.directory /gym_genesis && tail -f /dev/null"

volumes:
  composer_cache:
