services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_uploads:/var/www/html/storage/uploads
    restart: unless-stopped

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-gym_genesis_dev}
      MARIADB_USER: ${DB_USER:-gym_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD deve ser definida}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD deve ser definida}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  app_uploads:
