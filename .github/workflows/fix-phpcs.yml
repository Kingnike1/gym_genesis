name: Fix PHPCS

on:
  push:
    branches:
      - stack-30-monitoramento-producao

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stack-30-monitoramento-producao

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Apply PHPCBF fixes
        run: vendor/bin/phpcbf || true

      - name: Commit formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app routes scripts tests
          if git diff --cached --quiet; then
            echo "No auto-fixable PHPCS changes"
            exit 0
          fi
          git commit -m "style: apply automatic PSR-12 fixes"
          git push origin HEAD:stack-30-monitoramento-producao
