name: Refresh Composer Lock

on:
  push:
    branches:
      - stack-30-monitoramento-producao

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stack-30-monitoramento-producao

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Regenerate lock file
        run: composer update --with-all-dependencies --no-interaction --no-progress

      - name: Validate Composer
        run: composer validate --strict

      - name: Commit regenerated lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock already synchronized"
            exit 0
          fi
          git commit -m "fix(composer): synchronize lock file"
          git push origin HEAD:stack-30-monitoramento-producao
