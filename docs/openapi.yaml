openapi: 3.1.0
info:
  title: Gym Genesis API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      summary: Contexto do token atual
      responses:
        '200':
          description: Contexto autenticado
        '401':
          description: Token ausente, inválido, expirado ou revogado
  /students:
    get:
      summary: Lista alunos da academia do token
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Lista paginada
        '401':
          description: Não autenticado
        '403':
          description: Token sem `students:read`
        '429':
          description: Rate limit excedido
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
