services:
  - type: pserv
    name: gym-genesis-mysql-staging
    runtime: image
    plan: starter
    image:
      url: docker.io/library/mysql:8.0
    disk:
      name: gym-genesis-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: gym_genesis_staging
      - key: MYSQL_USER
        value: gym_genesis
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: gym-genesis-staging
    runtime: docker
    branch: stack-30-monitoramento-producao
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /ready
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh scripts/start-render.sh
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: PORT
        value: "8080"
      - key: APP_SECRET
        generateValue: true
      - key: DB_HOST
        fromService:
          type: pserv
          name: gym-genesis-mysql-staging
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: gym_genesis_staging
      - key: DB_USER
        value: gym_genesis
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: gym-genesis-mysql-staging
          envVarKey: MYSQL_PASSWORD
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Gym Genesis Staging
